[project]
name = "tenderly_david.larry"
version = "0.0.1"
dependencies = [
    "python-dotenv>=1.1.0",
    "web3~=7.11.1",
    "uvloop~=0.21.0",
    "typing_extensions~=4.13.2"
]
authors = [
  { name="David Larry", email="davidlarry@ethercrypt.xyz" },
]
description = "A small example package"
readme = "README.md"
